name: Publish Approved Short

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID containing the generated artifact"
        required: true
        type: string
      source_run_number:
        description: "GitHub Actions run number containing the generated artifact"
        required: true
        type: string
      approval_run_id:
        description: "Telegram approval run ID"
        required: true
        type: string
      youtube_title:
        description: "AI-generated Turkish YouTube title from the approval card"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Wait for source run and artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_NUMBER: ${{ inputs.source_run_number }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="shorts-run-${SOURCE_RUN_NUMBER}"
          echo "Waiting for source run ${SOURCE_RUN_ID} to finish and publish ${ARTIFACT_NAME}..."
          for attempt in $(seq 1 60); do
            RUN_JSON="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
            STATUS="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"${RUN_JSON}")"
            CONCLUSION="$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"${RUN_JSON}")"
            echo "Attempt ${attempt}: status=${STATUS}, conclusion=${CONCLUSION}"
            if [ "${STATUS}" = "completed" ]; then
              if [ "${CONCLUSION}" != "success" ]; then
                echo "Source run completed with conclusion=${CONCLUSION}"
                exit 1
              fi
              break
            fi
            sleep 20
          done
          test "${STATUS}" = "completed"
          ARTIFACTS_JSON="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?name=${ARTIFACT_NAME}")"
          COUNT="$(python -c 'import json,sys; print(len(json.load(sys.stdin)["artifacts"]))' <<<"${ARTIFACTS_JSON}")"
          test "${COUNT}" -gt 0
          echo "Artifact ${ARTIFACT_NAME} is available."

      - name: Download generated artifact
        uses: actions/download-artifact@v5
        with:
          name: shorts-run-${{ inputs.source_run_number }}
          path: source_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Locate generated video
        id: locate
        shell: bash
        run: |
          VIDEO="$(find source_artifact -type f -name 'final_short.mp4' | head -n 1)"
          METADATA="$(find source_artifact -type f -name 'metadata.json' | head -n 1)"
          test -n "$VIDEO"
          test -n "$METADATA"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "metadata=$METADATA" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        id: upload
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_PRIVACY_STATUS: public
          VIDEO: ${{ steps.locate.outputs.video }}
          METADATA: ${{ steps.locate.outputs.metadata }}
          YOUTUBE_TITLE: ${{ inputs.youtube_title }}
          YOUTUBE_PLAYLIST_TREND_HISTORY: ${{ secrets.YOUTUBE_PLAYLIST_TREND_HISTORY }}
          YOUTUBE_PLAYLIST_TODAY_IN_HISTORY: ${{ secrets.YOUTUBE_PLAYLIST_TODAY_IN_HISTORY }}
          YOUTUBE_PLAYLIST_AYT_HISTORY: ${{ secrets.YOUTUBE_PLAYLIST_AYT_HISTORY }}
          YOUTUBE_PLAYLIST_HISTORY_FACT: ${{ secrets.YOUTUBE_PLAYLIST_HISTORY_FACT }}
          YOUTUBE_PLAYLIST_CUSTOM: ${{ secrets.YOUTUBE_PLAYLIST_CUSTOM }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import youtube_uploader

          video = Path(os.environ["VIDEO"])
          metadata = json.loads(Path(os.environ["METADATA"]).read_text(encoding="utf-8"))
          scenes = metadata.get("scenes", [])
          full_text = " ".join(str(s.get("narration", "")) for s in scenes).strip()
          event = metadata.get("event_record", {})
          # The Telegram approval card uses the AI-generated Turkish title.
          # Preserve that exact title through the artifact into the publish job;
          # do not reconstruct the YouTube title from the canonical event title.
          # The approval workflow passes the exact title shown in Telegram.
          # This is the authoritative title for publishing.
          youtube_title = str(os.environ.get("YOUTUBE_TITLE", "")).strip()
          if not youtube_title:
              youtube_title = str(metadata.get("youtube_title", "")).strip()
          canonical_title = event.get("canonical_title", "Tarihin Bilinmeyen Gizemi")
          topic = {
              "title": canonical_title,
              "youtube_title": youtube_title,
              "hook_question": "",
              "content_type": str(metadata.get("content_type", "TREND_HISTORY")),
              "content_label": str(metadata.get("content_label", "")),
          }

          result = youtube_uploader.upload_shorts_video(
              video_path=video,
              topic=topic,
              full_text=full_text,
          )
          Path("publish_result.json").write_text(
              json.dumps(result, ensure_ascii=False),
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Get TikTok access token
        id: tiktok_token
        env:
          CONTROL_API_URL: ${{ secrets.CONTROL_API_URL }}
          CONTROL_API_SECRET: ${{ secrets.CONTROL_API_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-Control-Secret: ${CONTROL_API_SECRET}" \
            "${CONTROL_API_URL%/}/tiktok/access-token")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("access_token"), d; print("access_token="+d["access_token"])' <<<"${RESPONSE}" >> "$GITHUB_OUTPUT"

      - name: Upload to TikTok
        id: tiktok_upload
        env:
          TIKTOK_ACCESS_TOKEN: ${{ steps.tiktok_token.outputs.access_token }}
          VIDEO: ${{ steps.locate.outputs.video }}
          METADATA: ${{ steps.locate.outputs.metadata }}
          TIKTOK_TITLE: ${{ inputs.youtube_title }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import tiktok_uploader

          video = Path(os.environ["VIDEO"])
          metadata = json.loads(Path(os.environ["METADATA"]).read_text(encoding="utf-8"))
          title = str(os.environ.get("TIKTOK_TITLE", "")).strip()
          if not title:
              title = str(metadata.get("youtube_title", "")).strip()

          topic = {
              "title": title,
              "youtube_title": title,
              "tiktok_caption": title,
          }
          result = tiktok_uploader.publish_tiktok_video(
              video_path=video,
              topic=topic,
              is_aigc=True,
          )
          Path("tiktok_publish_result.json").write_text(
              json.dumps(result, ensure_ascii=False),
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False))

      - name: Notify Telegram control service
        if: always()
        env:
          CONTROL_API_URL: ${{ secrets.CONTROL_API_URL }}
          CONTROL_API_SECRET: ${{ secrets.CONTROL_API_SECRET }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          result_path = "publish_result.json"
          payload = {
              "run_id": os.environ["APPROVAL_RUN_ID"],
              "status": "published" if os.path.exists(result_path) else "publish_failed",
          }
          if os.path.exists(result_path):
              data = json.loads(open(result_path, encoding="utf-8").read())
              payload.update({
                  "youtube_url": data.get("url", ""),
                  "youtube_video_id": data.get("video_id", ""),
                  "playlist": data.get("playlist", {}),
              })
          else:
              payload["error"] = "YouTube upload workflow failed before producing publish_result.json"

          tiktok_path = "tiktok_publish_result.json"
          if os.path.exists(tiktok_path):
              data = json.loads(open(tiktok_path, encoding="utf-8").read())
              payload.update({
                  "tiktok_url": data.get("url", ""),
                  "tiktok_publish_id": data.get("publish_id", ""),
                  "tiktok_post_id": data.get("post_id"),
                  "tiktok_status": data.get("status", ""),
                  "tiktok_fail_reason": data.get("fail_reason", ""),
              })
          elif not payload.get("error"):
              payload["tiktok_error"] = "TikTok upload workflow failed before producing tiktok_publish_result.json"

          req = urllib.request.Request(
              os.environ["CONTROL_API_URL"].rstrip("/") + "/publish-result",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "X-Control-Secret": os.environ["CONTROL_API_SECRET"],
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print(response.read().decode())
          PY
