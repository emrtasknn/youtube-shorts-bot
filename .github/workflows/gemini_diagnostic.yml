name: Gemini Model Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Diagnostic Script
        run: |
          cat << 'EOF' > diagnostic.py
          import os
          import sys

          try:
              from google import genai
          except ImportError:
              print("google-genai SDK is not installed.")
              sys.exit(1)

          def main():
              api_key = os.environ.get("GEMINI_API_KEY")
              if not api_key:
                  print("GEMINI_API_KEY is missing from environment.")
                  sys.exit(1)
                  
              print("SDK available. Starting generateContent tests...\n")
              client = genai.Client(api_key=api_key)
              
              models_to_test = [
                  "gemini-2.5-flash",
                  "models/gemini-2.5-flash",
                  "gemini-flash-latest",
                  "models/gemini-flash-latest",
                  "gemini-2.5-pro",
                  "models/gemini-2.5-pro"
              ]
              
              for model_name in models_to_test:
                  print(f"MODEL: {model_name}")
                  try:
                      response = client.models.generate_content(
                          model=model_name,
                          contents="Reply with exactly: GEMINI_TEST_OK"
                      )
                      if response and response.text:
                          if "GEMINI_TEST_OK" in response.text:
                              print("RESULT: SUCCESS")
                          else:
                              print(f"RESULT: SUCCESS_BUT_UNEXPECTED_RESPONSE ({response.text.strip()})")
                      else:
                          print("RESULT: FAIL_NO_TEXT")
                  except Exception as e:
                      print(f"RESULT: FAIL")
                      print(f"ERROR: {e}")
                  print("-" * 40)
                  
          if __name__ == "__main__":
              main()
          EOF

      - name: Run Diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python diagnostic.py
