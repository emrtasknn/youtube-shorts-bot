name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/multi-provider-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m py_compile pipeline.py event_memory.py content_memory.py content_engine.py ai_provider.py image_provider.py media_provider.py gemini_config.py youtube_uploader.py

      - name: Run provider and routing tests
        run: python -m pytest -q tests/test_ai_provider.py tests/test_image_provider.py tests/test_media_provider.py
