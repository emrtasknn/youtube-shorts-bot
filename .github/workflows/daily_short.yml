name: Daily Shorts Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: daily-short-generator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core imagemagick

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          GEMINI_API_KEY: test
          TELEGRAM_BOT_TOKEN: 123456:TEST
          TELEGRAM_CHAT_ID: 1
        run: pytest -q

      - name: Restore topic history and approvals state
        uses: actions/cache@v4
        with:
          path: |
            topics_history.json
            approvals.json
            content_memory.json
          key: shorts-history-${{ github.run_id }}
          restore-keys: |
            shorts-history-

      - name: Generate Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
          AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH || 'false' }}
        run: python pipeline.py

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-run-${{ github.run_number }}
          path: |
            output/
            topics_history.json
            approvals.json
            content_memory.json
          if-no-files-found: warn
          retention-days: 7

