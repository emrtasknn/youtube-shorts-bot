name: Daily Shorts Generator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Generation mode"
        required: false
        default: "normal"
        type: string
      source_run_id:
        description: "Source GitHub Actions run ID for regeneration context"
        required: false
        default: ""
        type: string
      source_event_id:
        description: "Event ID being replaced"
        required: false
        default: ""
        type: string
      batch_count:
        description: "Number of Shorts to generate for Telegram review"
        required: false
        default: "10"
        type: string
      content_type:
        description: "Single content type when batch_count=1"
        required: false
        default: "TREND_HISTORY"
        type: string
      custom_prompt:
        description: "Custom content idea when content_type=CUSTOM"
        required: false
        default: ""
        type: string
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

concurrency:
  group: historical-shorts-generator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core imagemagick

      - name: Fix ImageMagick Policy for MoviePy
        run: |
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<policy domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: V1.2 Python syntax check
        run: python -m py_compile pipeline.py event_memory.py content_memory.py content_engine.py ai_provider.py image_provider.py media_provider.py gemini_config.py youtube_uploader.py

      - name: Generate Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER_ORDER: ${{ secrets.AI_PROVIDER_ORDER || 'gemini,openrouter,groq,openai' }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || '' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'openai/gpt-4.1-mini' }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          REAL_MEDIA_PROVIDER_ORDER: ${{ secrets.REAL_MEDIA_PROVIDER_ORDER || 'pexels,pixabay,unsplash' }}
          REAL_MEDIA_MIN_SEARCH_SCORE: ${{ secrets.REAL_MEDIA_MIN_SEARCH_SCORE || '0.35' }}
          MEDIA_PROVIDER_TIMEOUT_SECONDS: ${{ secrets.MEDIA_PROVIDER_TIMEOUT_SECONDS || '15' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          DEEPAI_API_KEY: ${{ secrets.DEEPAI_API_KEY }}
          IMAGE_PROVIDER_ORDER: ${{ secrets.IMAGE_PROVIDER_ORDER || 'imagen,cloudflare,fal,together,deepai,pollinations_turbo,pollinations_flux,huggingface' }}
          GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL || 'imagen-3.0-generate-002' }}
          IMAGE_MAX_ATTEMPTS_PER_PROVIDER: ${{ secrets.IMAGE_MAX_ATTEMPTS_PER_PROVIDER || '1' }}
          IMAGE_PROVIDER_COOLDOWN_SECONDS: ${{ secrets.IMAGE_PROVIDER_COOLDOWN_SECONDS || '1800' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
          AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH || 'false' }}
          CONTROL_API_URL: ${{ secrets.CONTROL_API_URL }}
          CONTROL_API_SECRET: ${{ secrets.CONTROL_API_SECRET }}
          GENERATION_MODE: ${{ inputs.mode || 'normal' }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          SOURCE_EVENT_ID: ${{ inputs.source_event_id || '' }}
          BATCH_COUNT: ${{ inputs.batch_count || '10' }}
          CONTENT_TYPE: ${{ inputs.content_type || 'TREND_HISTORY' }}
          CUSTOM_PROMPT: ${{ inputs.custom_prompt || '' }}
        run: python pipeline.py

      - name: Commit state changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Add any memory files that may have been created or modified
          git add event_memory.json content_memory.json 2>/dev/null || true
          git commit -m "chore: update event memory state [skip ci]" || echo "No state changes to commit"
          git push

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-run-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
