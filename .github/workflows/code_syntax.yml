name: Code Syntax Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile pipeline.py content_engine.py event_memory.py content_memory.py gemini_config.py youtube_uploader.py
      - name: Runtime import smoke test
        run: python -c "import pipeline; from moviepy import concatenate_audioclips; print('MoviePy audio import OK')"
