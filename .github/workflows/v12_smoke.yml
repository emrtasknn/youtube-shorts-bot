name: V1.4 Smoke Tests

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: python -m py_compile pipeline.py event_memory.py content_memory.py gemini_config.py youtube_uploader.py

      - name: Visual and MoviePy API smoke test
        run: |
          python - <<'PY'
          from moviepy import AudioFileClip
          import event_memory

          assert hasattr(AudioFileClip, "transform"), "MoviePy AudioFileClip.transform is unavailable"
          assert event_memory._visual_relevance("Emu War Lewis gun", "Lewis Gun during Emu War") >= 0.55
          assert event_memory._visual_relevance("10,000 rounds ammunition", "random desert landscape") < 0.55

          _, map_meta = event_memory._visual_intent_match_score(
              "St Giles & Holborn Civil Parish Map 1870",
              "historical map of St Giles parish",
              "The London Beer Flood vintage city map",
              "The London Beer Flood",
              {"primary_subject": "vintage city map", "visual_type": "map",
               "must_show": ["old paper texture", "London district street layout"]}
          )
          assert map_meta["intent_pass"], "Relevant historical map should pass"

          _, court_meta = event_memory._visual_intent_match_score(
              "St James Court Fountain Louisville",
              "architecture and fountain",
              "The London Beer Flood courtroom judge bench legal documents",
              "The London Beer Flood",
              {"primary_subject": "courtroom judge bench", "visual_type": "artifact",
               "must_show": ["wooden bench", "legal documents"]}
          )
          assert not court_meta["intent_pass"], "Generic architecture must not pass courtroom intent"

          _, crowd_meta = event_memory._visual_intent_match_score(
              "'Tickets,' The Card Dealer (1877): Remixed",
              "historical card dealer artwork",
              "The London Beer Flood crowd of people foggy atmosphere historical silhouettes",
              "The London Beer Flood",
              {"primary_subject": "crowd of people", "visual_type": "crowd",
               "must_show": ["foggy atmosphere", "historical silhouettes"]}
          )
          assert not crowd_meta["intent_pass"], "Unrelated artwork must not pass crowd intent"

          from pathlib import Path
          pipeline_text = Path("pipeline.py").read_text(encoding="utf-8")
          for profile in ("documentary_male", "mystery_female", "dramatic_male", "energetic_female"):
              assert profile in pipeline_text, f"Missing V1.4 voice profile: {profile}"
          assert '"ending_strategy": "semantic"' in pipeline_text, "V1.4 ending strategy schema missing"
          assert "Natural ending + loop strategy" in pipeline_text, "Natural ending QA missing"
          assert "V1.4 visual loop" in pipeline_text, "Visual loop implementation missing"

          print("V1.4 smoke tests passed")
          PY
