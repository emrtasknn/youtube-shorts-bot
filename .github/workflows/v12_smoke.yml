name: V1.4.1 Smoke Tests

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax
        run: python -m py_compile pipeline.py event_memory.py content_memory.py gemini_config.py youtube_uploader.py

      - name: Visual and MoviePy API smoke test
        run: |
          python - <<'PY'
          from moviepy import AudioFileClip
          import event_memory

          assert hasattr(AudioFileClip, "transform"), "MoviePy AudioFileClip.transform is unavailable"
          assert event_memory._visual_relevance("Emu War Lewis gun", "Lewis Gun during Emu War") >= 0.55
          assert event_memory._visual_relevance("10,000 rounds ammunition", "random desert landscape") < 0.55

          specificity, spec_meta = event_memory._visual_event_specificity(
              "Fallen trees in Tunguska blast zone",
              "Tunguska Event Siberia fallen trees knocked down by blast wave",
              "Tunguska blast wave knocked down fallen trees",
              "The Tunguska Event",
              ["Tunguska Olayı", "1908 Sibirya Patlaması"],
              "Siberia, Russia",
              ["Leonid Kulik"],
              "1908",
          )
          assert specificity >= 0.70, f"Event-specific visual should score high: {specificity}"
          assert spec_meta["fact_coverage"] > 0.0

          generic_specificity, _ = event_memory._visual_event_specificity(
              "Generic winter forest landscape",
              "snowy forest and dramatic mountains at sunset",
              "Tunguska blast wave knocked down fallen trees",
              "The Tunguska Event",
              ["Tunguska Olayı"],
              "Siberia, Russia",
              ["Leonid Kulik"],
              "1908",
          )
          assert generic_specificity < specificity, "Generic atmosphere must score below event-specific evidence"

          _, map_meta = event_memory._visual_intent_match_score(
              "St Giles & Holborn Civil Parish Map 1870",
              "historical map of St Giles parish",
              "The London Beer Flood vintage city map",
              "The London Beer Flood",
              {"primary_subject": "vintage city map", "visual_type": "map",
               "must_show": ["old paper texture", "London district street layout"]}
          )
          assert map_meta["intent_pass"], "Relevant historical map should pass"

          _, court_meta = event_memory._visual_intent_match_score(
              "St James Court Fountain Louisville",
              "architecture and fountain",
              "The London Beer Flood courtroom judge bench legal documents",
              "The London Beer Flood",
              {"primary_subject": "courtroom judge bench", "visual_type": "artifact",
               "must_show": ["wooden bench", "legal documents"]}
          )
          assert not court_meta["intent_pass"], "Generic architecture must not pass courtroom intent"

          _, crowd_meta = event_memory._visual_intent_match_score(
              "'Tickets,' The Card Dealer (1877): Remixed",
              "historical card dealer artwork",
              "The London Beer Flood crowd of people foggy atmosphere historical silhouettes",
              "The London Beer Flood",
              {"primary_subject": "crowd of people", "visual_type": "crowd",
               "must_show": ["foggy atmosphere", "historical silhouettes"]}
          )
          assert not crowd_meta["intent_pass"], "Unrelated artwork must not pass crowd intent"

          from pathlib import Path
          pipeline_text = Path("pipeline.py").read_text(encoding="utf-8")
          event_memory_text = Path("event_memory.py").read_text(encoding="utf-8")
          for profile in ("documentary_male", "mystery_female", "dramatic_male", "energetic_female"):
              assert profile in pipeline_text, f"Missing V1.4 voice profile: {profile}"
          assert '"ending_strategy": "semantic"' in pipeline_text, "V1.4 ending strategy schema missing"
          assert "Natural ending + loop strategy" in pipeline_text, "Natural ending QA missing"
          assert "V1.4 visual loop" in pipeline_text, "Visual loop implementation missing"
          assert '"visual_fact": "..."' in pipeline_text, "Visual fact schema missing"
          assert "event_specificity" in pipeline_text, "Visual specificity QA missing"
          assert "information_density" in pipeline_text, "Visual density QA missing"
          assert "_visual_event_specificity" in event_memory_text, "Event specificity helper missing"
          assert "_visual_information_density" in event_memory_text, "Visual information density helper missing"
          assert "visual_fact" in event_memory_text, "Visual fact query integration missing"
          assert "visual_action" in pipeline_text, "Visual action schema missing"
          assert "scene_context" in pipeline_text, "Scene context schema missing"
          assert "shot_type" in pipeline_text, "Shot type schema missing"
          assert "composition" in pipeline_text, "Composition schema missing"
          assert "visual_action" in event_memory_text, "Visual action scoring missing"

          action_intent = {
              "primary_subject": "historical marathon runner",
              "visual_type": "action",
              "visual_action": "runner eating an apple beside the race route",
              "scene_context": "1904 St Louis marathon race route",
              "shot_type": "medium action shot",
              "composition": "runner beside roadside tree with fruit and race road visible",
              "visual_entities": ["marathon runner", "apple"],
              "must_show": ["runner", "race road", "apple"],
              "avoid": ["isolated apple", "modern runner"],
          }
          _, action_meta = event_memory._visual_intent_match_score(
              "Felix Carvajal eating apple during 1904 Olympic marathon",
              "runner eating an apple beside the St Louis race route",
              "1904 Olympic marathon runner eating apple beside race route",
              "The 1904 Olympic Marathon",
              action_intent,
          )
          assert action_meta["intent_pass"], "Action-specific historical visual should pass"

          _, object_meta = event_memory._visual_intent_match_score(
              "Red apple on wooden table",
              "close-up of a red apple",
              "1904 Olympic marathon runner eating apple beside race route",
              "The 1904 Olympic Marathon",
              action_intent,
          )
          assert not object_meta["intent_pass"], "Isolated object must not satisfy an action scene"

          print("V1.4.1 smoke tests passed")
          PY
